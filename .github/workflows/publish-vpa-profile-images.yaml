name: Publish VPA profile images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-vpa-profile-images
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [recommender, updater, admission-controller]
    steps:
      - name: Require the profile branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/vpa-profile-poc" ]; then
            echo "::error::Select the vpa-profile-poc branch when running this workflow."
            exit 1
          fi
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./vertical-pod-autoscaler
          file: ./vertical-pod-autoscaler/pkg/${{ matrix.component }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/kevinkrp93/vpa-${{ matrix.component }}:vpa-profile-poc
            ghcr.io/kevinkrp93/vpa-${{ matrix.component }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
